name: PR Sentinel Checks

on:
  pull_request:
    paths:
      - "**.csv"
      - "**.json"
      - "**.jsonl"
      - "**.parquet"
      - "**.ipynb"
      - "src/**"
      - "package.json"
      - "action.yml"

jobs:
  pr-sentinel:
    runs-on: ubuntu-latest
    name: ML/Data Quality Checks

    permissions:
      contents: read
      security-events: write

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug pre-run
        run: |
          echo "=== dist contents ==="
          ls -la dist/ || echo "dist/ NOT FOUND"
          echo "=== action.yml ==="
          head -5 action.yml
          echo "=== node version ==="
          node --version

      - name: Run PR Sentinel
        uses: ./
        with:
          model-id: "anthropic.claude-opus-4-5-20251101-v1:0"
          checks: "pii,secrets,schema,notebook,license"
          severity-threshold: "warning"
          output-format: "sarif"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - list output files
        if: always()
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Files in workspace ==="
          ls -la
          echo "=== SARIF file check ==="
          ls -la sarif-report.sarif 2>&1 || echo "sarif-report.sarif NOT FOUND"

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-report.sarif
