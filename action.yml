name: "PR Sentinel - ML/Data Quality Checks"
description: "AI-powered GitHub Action for detecting PII, schema drift, and data-quality issues in diffs"
author: "PR Sentinel"

inputs:
  model-id:
    description: "Model ID (e.g., anthropic.claude-opus-4-5-20251101-v1:0 for Bedrock)"
    required: true
  severity-threshold:
    description: "Minimum severity to report: info, warning, error"
    required: false
    default: "warning"
  checks:
    description: "Comma-separated checks: pii,secrets,schema,notebook,license"
    required: false
    default: "pii,secrets,schema"
  output-format:
    description: "Output format: sarif, jsonl, or both"
    required: false
    default: "sarif"
  github-token:
    description: "GitHub token for fetching PR diff"
    required: true

runs:
  using: "composite"
  steps:
    - name: Run PR Sentinel checks
      id: run-sentinel
      shell: bash
      run: node ${{ github.action_path }}/dist/index.bundled.cjs
      env:
        INPUT_MODEL_ID: ${{ inputs.model-id }}
        INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}

branding:
  icon: "shield-alert"
  color: "blue"
