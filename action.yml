name: "PR Sentinel — ML/Data Quality Checks"
description: "AI-powered GitHub Action for detecting PII, schema drift, and data-quality issues in diffs"
author: "PR Sentinel"

inputs:
  model-id:
    description: "Model ID. Bedrock: anthropic.claude-opus-4-5-20251101-v1:0  Direct API: claude-opus-4-1"
    required: true
  severity-threshold:
    description: "Minimum severity to report: info, warning, error"
    required: false
    default: "warning"
  checks:
    description: "Comma-separated checks to run: pii,secrets,schema,notebook,license"
    required: false
    default: "pii,secrets,schema"
  output-format:
    description: "Output format: sarif, jsonl, or both"
    required: false
    default: "sarif"
  github-token:
    description: "GitHub token for fetching PR diff"
    required: true

outputs:
  sarif-file:
    description: "Path to generated SARIF file"
    value: ${{ steps.run-sentinel.outputs.sarif-file }}
  jsonl-file:
    description: "Path to generated JSONL evidence log"
    value: ${{ steps.run-sentinel.outputs.jsonl-file }}
  issue-count:
    description: "Total number of issues found"
    value: ${{ steps.run-sentinel.outputs.issue-count }}

runs:
  using: "composite"
  steps:
    - name: Run PR Sentinel checks
      id: run-sentinel
      run: node ${{ github.action_path }}/dist/index.bundled.js
      shell: bash
      env:
        # core.getInput reads INPUT_<NAME-UPPERCASED> with hyphens preserved.
        # We also expose them without hyphens as a fallback in index.ts.
        INPUT_MODEL-ID: ${{ inputs.model-id }}
        INPUT_SEVERITY-THRESHOLD: ${{ inputs.severity-threshold }}
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_OUTPUT-FORMAT: ${{ inputs.output-format }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        # AWS credentials for Bedrock (optional - pass through from caller)
        AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ env.AWS_REGION }}

branding:
  icon: "shield-alert"
  color: "blue"
